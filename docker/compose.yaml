# Local Ollama for nvim-learn-refactor. Works with `podman compose` and `docker compose`.
# Networking lives in compose.bridge.yaml (published port) or compose.host.yaml (host network);
# :RefactorOllama picks one. By hand:
#   podman compose -f compose.yaml -f compose.bridge.yaml up -d
#   podman exec learn-refactor-ollama ollama pull qwen2.5-coder:14b
name: learn-refactor

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: learn-refactor-ollama
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      # default is 4096 tokens, too small for prompt + code + solution + tests (silently truncates the JSON)
      OLLAMA_CONTEXT_LENGTH: "16384"
    restart: unless-stopped

volumes:
  ollama-models:
