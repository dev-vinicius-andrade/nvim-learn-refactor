# Local Ollama for nvim-learn-refactor. Works with `podman compose` and `docker compose`.
# Managed by :RefactorOllama, or by hand:
#   podman compose -f docker/compose.yaml up -d
#   podman exec learn-refactor-ollama ollama pull qwen2.5-coder:14b
name: learn-refactor

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: learn-refactor-ollama
    # localhost only: the API has no auth
    ports:
      - "127.0.0.1:${LEARN_REFACTOR_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    restart: unless-stopped

volumes:
  ollama-models:
